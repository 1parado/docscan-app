name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# The tag build attaches the APK to a GitHub Release, and the default
# GITHUB_TOKEN is read-only, so "Create a release" fails with
# "Resource not accessible by integration" without this.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Launcher icon: render assets/icon.svg into all mipmap densities.
      - name: Render launcher icons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case $d in
              mdpi) s=48;; hdpi) s=72;; xhdpi) s=96;; xxhdpi) s=144;; xxxhdpi) s=192;;
            esac
            mkdir -p android/app/src/main/res/mipmap-$d
            rsvg-convert -w $s -h $s assets/icon.svg -o android/app/src/main/res/mipmap-$d/ic_launcher.png
          done

      - run: flutter pub get

      - run: flutter test

      # Release build signed with debug keys for sideloading; CI never signs
      # with real release keys.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: docscan-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Attach the APK to GitHub Releases for tag pushes.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
